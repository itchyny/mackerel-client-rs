[package]
name = "mackerel_client"
version = "0.6.6"
authors = ["itchyny <itchyny@cybozu.co.jp>"]
description = "An API client library for Mackerel"
repository = "https://github.com/itchyny/mackerel-client-rs"
readme = "README.md"
license = "MIT"
keywords = ["api", "mackerel"]
categories = ["api-bindings"]
edition = "2021"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
fixedstr = { version = "0.5.11", features = ["serde"] }
http = "1.5.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", features = ["json"] }
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.154"
serde_with = { version = "3.24.0", features = ["chrono"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
typed-builder = "0.23.2"
url = "2.5.8"

[dev-dependencies]
async-std = { version = "1.13.2", features = ["attributes", "tokio1"] }
httptest = "0.16.4"
pretty_env_logger = "0.5.0"
rstest = "0.28.0"
